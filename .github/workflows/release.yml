name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  cli:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: traceforge-linux-x86_64
            binary: target/release/traceforge
          - os: windows-latest
            artifact: traceforge-windows-x86_64.exe
            binary: target/release/traceforge.exe
          - os: macos-latest
            artifact: traceforge-macos
            binary: target/release/traceforge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p traceforge-cli
      - shell: bash
        run: cp '${{ matrix.binary }}' '${{ matrix.artifact }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: sha256sum artifacts/* > artifacts/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
